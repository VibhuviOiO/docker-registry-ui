services:
  htpasswd-generator:
    image: httpd:2.4
    command: htpasswd -Bbn admin secret
    volumes:
      - auth-data:/tmp
    entrypoint: >
      sh -c "htpasswd -Bbn admin secret > /tmp/htpasswd && echo 'htpasswd generated'"
  registry-dev:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-dev-data:/var/lib/registry
    networks:
      - registry-net

  registry-auth:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-auth-data:/var/lib/registry
    networks:
      - registry-net

  nginx-proxy:
    image: nginx:stable-alpine
    ports:
      - "5004:5004"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - auth-data:/etc/nginx:ro
    depends_on:
      - registry-auth
      - htpasswd-generator
    networks:
      - registry-net
    command: >
      sh -c "while [ ! -f /etc/nginx/htpasswd ]; do sleep 1; done && nginx -g 'daemon off;'"

  registry-ui:
    image: ghcr.io/vibhuvioio/docker-registry-ui:latest
    ports:
      - "5003:5000"
    volumes:
      - ./registries.config.json:/app/registries.config.json:ro
      - ./data:/app/data
      - ./trivy-data:/root/.cache/trivy
    depends_on:
      - registry-dev
      - nginx-proxy
    networks:
      - registry-net

volumes:
  registry-dev-data:
  registry-auth-data:
  auth-data:

networks:
  registry-net:
    driver: bridge