name: Release

# Creates the GitHub release for a tag that a human pushed, using the matching
# CHANGELOG.md section as the body.
#
# This workflow never creates a tag: `gh release create --verify-tag` fails if
# the tag does not already exist. Tagging stays a deliberate, human step.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish the release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from version.py
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: The tag must match app/version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match app/version.py ($VERSION). Bump app/version.py before tagging a release."
            exit 1
          fi

      - name: Build the release notes from CHANGELOG.md
        run: |
          python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" > release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
