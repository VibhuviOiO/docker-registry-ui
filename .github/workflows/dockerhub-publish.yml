name: Docker Hub Publish

permissions:
  contents: read

# Releases are published from tags only. Pushing to main no longer publishes,
# so a branch can be tested before anything is released.
on:
  push:
    tags:
      - "v*.*.*"
  # Manual re-publish after e.g. a registry outage. Still requires a tag ref;
  # see the "tag-triggered only" guard in the job.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKERHUB_NAMESPACE: vibhuvioio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from version.py
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Tag-triggered only
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Releases are published from tags only. Nothing is published from a branch."
            exit 1
          fi

      - name: The tag must match app/version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match app/version.py ($VERSION). Bump app/version.py before tagging a release."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches app/version.py ($VERSION)"

      - name: The release must have notes in CHANGELOG.md
        run: python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-registry-ui:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-registry-ui:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
