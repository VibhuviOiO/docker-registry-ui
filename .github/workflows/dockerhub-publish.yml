name: Docker Hub Publish

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKERHUB_NAMESPACE: vibhuvioio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from version.py
        id: version
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' app/version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-registry-ui:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-registry-ui:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
